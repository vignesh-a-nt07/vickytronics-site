replicaCount: 1   # low cost

frontend:
  image:
    repository: 393078901209.dkr.ecr.us-east-1.amazonaws.com/ecommerce-vicky-frontend
    tag: latest
    pullPolicy: Always
  containerPort: 3000

backend:
  image:
    repository: 393078901209.dkr.ecr.us-east-1.amazonaws.com/ecommerce-vicky-backend
    tag: latest
    pullPolicy: Always
  containerPort: 3001

service:
  type: ClusterIP
  frontendPort: 80
  backendPort: 3001

database:
  secretName: db-secret

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/group.name: ecommerce
